name: Build and Verify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: List all files
        run: find build -type f -name "*.jar" -o -name "*.json" | sort
      - name: Show JAR contents
        run: |
          for f in build/libs/*.jar; do
            echo "=== $(basename $f) ($(wc -c < $f) bytes) ==="
            jar tf "$f" | head -25
          done
      - name: Upload remapped JAR only
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/crossbowaim-*.jar
