name: Build Mod
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Show JARs
        run: find . -name "*.jar" -type f 2>/dev/null || echo "No JARs found"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - name: Upload JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossbowaim-jar
          path: "**/*.jar"
