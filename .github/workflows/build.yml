name: Build and Verify
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace 2>&1 | tee build.log
      - name: Dump JAR contents
        run: |
          echo "=== Finder ===" && find build -name "*.jar" -ls
          echo "=== JAR Inspection ==="
          for f in build/libs/*.jar; do
            echo "--- $f ---"
            jar tf "$f" | head -30
            echo "CrossbowAim in jar:"
            jar tf "$f" | grep -i crossbow || echo "(not found)"
          done
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossbowaim-jar
          path: build/libs/*.jar
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
