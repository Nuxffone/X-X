name: Build and Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Verify JAR contents
        run: |
          echo "=== Available JARs ==="
          find build -name "*.jar" -ls
          JAR=$(find build/libs -name "*.jar" -not -name "*-sources*" -not -name "*-dev*" 2>/dev/null | head -1)
          if [ -n "$JAR" ]; then
            echo "=== Mod JAR: $JAR ==="
            echo "--- Contents: ---"
            jar tf "$JAR" | sort
            echo "--- fabric.mod.json: ---"
            jar xf "$JAR" fabric.mod.json 2>/dev/null && cat fabric.mod.json && echo ""
            echo "--- CrossbowAimMod.class exists? ---"
            jar tf "$JAR" | grep CrossbowAimMod || echo "MISSING!"
          else
            echo "ERROR: No remapped JAR found in build/libs/"
            find build -name "*.jar" -ls
          fi
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: crossbowaim-jar
          path: build/libs/*.jar
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build
          name: Latest Build
          body: 弩箭预瞄+自动攻击 Fabric mod for MC 26.2
          files: build/libs/crossbowaim-*.jar
          prerelease: true
